# Builds the Eleventy site and publishes it to GitHub Pages.
# NOTE: before merging this branch to main, switch the repo's
# Settings > Pages > Source from "Deploy from a branch" to "GitHub Actions".
name: Deploy garden
on:
  push:
    branches: [main]
  workflow_dispatch:
  # Daily rebuild so new Medium posts (and later Goodreads) show up on their own.
  schedule:
    - cron: "0 11 * * *"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/sync-medium.mjs
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
